name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Install Python dependencies
        run: python -m pip install -r control-api/requirements.txt -r multisensor/api/requirements.txt -r notifier/requirements.txt pytest

      - name: Run Python tests
        run: PYTHONPATH=control-api python -m pytest control-api/tests multisensor/tests notifier/tests

      - name: Build notifier image
        run: docker build --file notifier/Dockerfile --tag perimetral-notifier:ci .

      - name: Build control-api image
        run: docker build --file control-api/Dockerfile --tag perimetral-control-api:ci .

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
