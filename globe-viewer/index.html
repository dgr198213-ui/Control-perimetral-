<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perímetro — Visor 3D</title>
    <style>
      html, body, #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #multisensorStatus {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        font-family: monospace;
        font-size: 12px;
        color: #b8d8ff;
        background: rgba(0,0,0,0.65);
        padding: 7px 10px;
        border-radius: 6px;
        max-width: 360px;
      }
      #mapControls {
        position: absolute;
        right: 10px;
        bottom: 10px;
        z-index: 10;
        display: grid;
        gap: 6px;
        font: 12px monospace;
        color: #e7f0ff;
        background: rgba(0,0,0,0.72);
        padding: 9px;
        border-radius: 6px;
        max-width: 330px;
      }
      #mapControls button {
        cursor: pointer;
        border: 1px solid #52739e;
        border-radius: 4px;
        padding: 6px 8px;
        background: #182b45;
        color: #fff;
      }
      #mapControls small { color: #b8d8ff; line-height: 1.35; }
      #eventFeed {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        font-family: monospace;
        font-size: 13px;
        color: #7CFC00;
        background: rgba(0,0,0,0.55);
        padding: 8px 12px;
        border-radius: 6px;
        max-width: 420px;
        max-height: 200px;
        overflow-y: auto;
        white-space: pre-line;
      }
      @media (max-width: 480px) {
        #multisensorStatus {
          top: 10px;
          right: 10px;
          left: 10px;
          max-width: none;
          font-size: 11px;
        }
        #eventFeed {
          top: auto;
          right: 10px;
          bottom: 10px;
          left: 10px;
          max-width: none;
          max-height: 28vh;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="multisensorStatus">Multisensor: conectando…</div>
    <div id="mapControls">
      <button id="toggleTraffic" data-visible="false" type="button">Mostrar cámaras DGT</button>
      <button id="refreshTraffic" type="button">Actualizar catálogo DGT</button>
      <small id="satelliteStatus">Cargando capa satelital…</small>
      <small id="trafficStatus">Cámaras DGT: cargando…</small>
      <small>La capa DGT muestra imágenes públicas; no accede a cámaras privadas ni garantiza vídeo continuo.</small>
      <small>© Esri World Imagery · © DGT · <a href="https://nap.dgt.es/en/dataset/camaras-dgt-datex2-v3-7" target="_blank" rel="noreferrer">fuente DGT</a></small>
    </div>
    <div id="eventFeed">Esperando eventos de Frigate y del núcleo multisensor…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
