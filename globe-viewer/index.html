<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perímetro — Visor 3D</title>
    <style>
      html, body, #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #eventFeed {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        font-family: monospace;
        font-size: 13px;
        color: #7CFC00;
        background: rgba(0,0,0,0.55);
        padding: 8px 12px;
        border-radius: 6px;
        max-width: 320px;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="eventFeed">Esperando eventos de Frigate…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
