<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calibración de cámaras</title>
    <style>
      html, body, #cesiumContainer {
        width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000;
      }
      #panel {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        width: 300px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #eee;
        background: rgba(20,20,20,0.9);
        padding: 14px;
        border-radius: 8px;
        max-height: 92vh;
        overflow-y: auto;
      }
      #panel h3 { margin: 0 0 8px; font-size: 14px; color: #7CFC00; }
      #panel label { display: block; margin-top: 8px; }
      #panel input[type=range] { width: 100%; }
      #panel input[type=text], #panel input[type=number] {
        width: 100%; box-sizing: border-box; margin-top: 2px;
      }
      #panel button {
        margin-top: 10px; width: 100%; padding: 8px; cursor: pointer;
        background: #2c6e2c; color: white; border: none; border-radius: 4px;
      }
      #panel button.secondary { background: #444; }
      #instructions { font-size: 12px; color: #ccc; line-height: 1.4; }
      #exportBox {
        width: 100%; height: 160px; font-family: monospace; font-size: 11px;
        margin-top: 8px; box-sizing: border-box;
      }
      .step { color: #7CFC00; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="panel">
      <h3>📍 Calibración de cámaras</h3>
      <div id="instructions">
        <span class="step">1 clic</span> = colocar y afinar a mano (posición → hacia dónde apunta → ajustas sliders).<br/>
        <span class="step">doble clic</span> = añade la cámara al instante con id, nombre y pose por defecto — edítalos luego en el export si hace falta.
      </div>

      <div id="editorFields" style="display:none">
        <label>ID (debe coincidir con frigate/config.yml)
          <input type="text" id="fId" placeholder="camara_1" />
        </label>
        <label>Nombre visible
          <input type="text" id="fLabel" placeholder="Cámara entrada norte" />
        </label>
        <label>Lat / Lon (calculado)
          <input type="text" id="fLatLon" readonly />
        </label>
        <label>Heading (calculado, °): <span id="fHeadingVal">-</span>
          <input type="range" id="fHeading" min="0" max="359" step="1" />
        </label>
        <label>Inclinación / pitch (°): <span id="fPitchVal">-15</span>
          <input type="range" id="fPitch" min="-89" max="30" step="1" value="-15" />
        </label>
        <label>Campo de visión / FOV (°): <span id="fFovVal">95</span>
          <input type="range" id="fFov" min="30" max="150" step="1" value="95" />
        </label>
        <label>Alcance fiable (m): <span id="fRangeVal">30</span>
          <input type="range" id="fRange" min="5" max="100" step="1" value="30" />
        </label>
        <label>Altura de montaje (m): <span id="fMountVal">3</span>
          <input type="range" id="fMount" min="0.5" max="15" step="0.5" value="3" />
        </label>
        <button id="btnSave">Guardar cámara</button>
        <button id="btnCancel" class="secondary">Cancelar</button>
      </div>

      <button id="btnExport" class="secondary">Exportar cameras.config.js</button>
      <textarea id="exportBox" style="display:none"></textarea>
    </div>
    <script type="module" src="/src/calibrate.js"></script>
  </body>
</html>
