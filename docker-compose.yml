services:
  frigate-config-init:
    container_name: perimetral-frigate-config-init
    image: busybox:1.37.0-musl
    restart: "no"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    read_only: true
    command: ["sh", "-c", "test -f /config/config.yml || cp /template/config.yml /config/config.yml; chown 10002:10002 /config /config/config.yml"]
    volumes:
      - ./frigate/config.template.yml:/template/config.yml:ro
      - ./data/frigate-config:/config

  frigate:
    container_name: perimetral-frigate
    image: ghcr.io/blakeblackshear/frigate:0.16.2
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    shm_size: "256mb"
    expose:
      - "5000"
    volumes:
      - ./data/frigate-config:/config-generated:ro
      - ./storage:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    environment:
      CONFIG_FILE: /config-generated/config.yml
      FRIGATE_MQTT_HOST: mosquitto
      FRIGATE_MQTT_PORT: 1883
    depends_on:
      frigate-config-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/version >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  mosquitto:
    container_name: perimetral-mosquitto
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./storage/mosquitto:/mosquitto/data
    expose:
      - "1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    container_name: perimetral-control-api
    build:
      context: .
      dockerfile: control-api/Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    env_file:
      - .env
    environment:
      CONTROL_API_DB: /data/control-api.sqlite3
      FRIGATE_CONFIG_PATH: /config-generated/config.yml
      FRIGATE_API_URL: http://frigate:5000
    volumes:
      - ./data/control-api:/data
      - ./data/frigate-config:/config-generated
    expose:
      - "8000"
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    depends_on:
      frigate-config-init:
        condition: service_completed_successfully
      frigate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  multisensor-api:
    container_name: perimetral-multisensor-api
    build:
      context: .
      dockerfile: multisensor/Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    env_file:
      - .env
    environment:
      COMPLIANCE_DIR: /compliance
      MULTISENSOR_DB: /data/multisensor.sqlite3
    volumes:
      - ./compliance:/compliance:ro
      - ./data/multisensor:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/multisensor/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    container_name: perimetral-caddy
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    cap_drop:
      - ALL
    environment:
      CADDY_HOSTNAME: "${CADDY_HOSTNAME:-localhost}"
    ports:
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dashboard/dist:/srv/dashboard:ro
      - ./storage/caddy-data:/data
      - ./storage/caddy-config:/config
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  notifier:
    container_name: perimetral-notifier
    build:
      context: .
      dockerfile: notifier/Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      COMPLIANCE_DIR: /compliance
      MULTISENSOR_DB: /data/multisensor.sqlite3
      ACTIONS_DB: /data/actions.sqlite3
    volumes:
      - ./compliance:/compliance:ro
      - ./data/multisensor:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; assert os.path.isdir(\"/data\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mosquitto:
        condition: service_healthy

networks:
  default:
    name: perimetral-internal
