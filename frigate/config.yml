mqtt:
  host: mosquitto
  port: 1883

# Detección genérica COCO; no hay reconocimiento facial ni identificación biométrica.
objects:
  track:
    - person
    - car
    - motorcycle
    - bicycle
  filters:
    person:
      min_score: 0.6
      threshold: 0.7
    car:
      min_score: 0.6
      threshold: 0.7
    motorcycle:
      min_score: 0.6
      threshold: 0.7
    bicycle:
      min_score: 0.6
      threshold: 0.7

detectors:
  cpu1:
    type: cpu

# BLOQUEO DE CUMPLIMIENTO: no cambiar manualmente antes de ejecutar
# scripts/enable-recording.sh con las dos evidencias requeridas.
record:
  enabled: false
  retain:
    days: 3
    mode: motion
  events:
    retain:
      default: 10
      mode: active_objects

# Los snapshots también pueden contener personas; permanecen desactivados.
snapshots:
  enabled: false

cameras:
  camara_1:
    ffmpeg:
      inputs:
        - path: rtsp://usuario:contraseña@IP_CAMARA_1:554/ruta_stream
          roles:
            - detect
    detect:
      width: 1280
      height: 720
      fps: 5
    zones:
      zona_perimetro:
        coordinates: 0,0,1,0,1,1,0,1
        objects:
          - person
          - car
          - motorcycle
          - bicycle

  camara_2:
    ffmpeg:
      inputs:
        - path: rtsp://usuario:contraseña@IP_CAMARA_2:554/ruta_stream
          roles:
            - detect
    detect:
      width: 1280
      height: 720
      fps: 5
    zones:
      zona_perimetro:
        coordinates: 0,0,1,0,1,1,0,1
        objects:
          - person
          - car
          - motorcycle
          - bicycle
